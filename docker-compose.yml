# OmniNAV 生产编排：Redis + 应用（前端由应用容器同源托管）
# PostgreSQL 复用 NAS 上已有的实例，不放进 compose。
# 用法：仓库放到飞牛 NAS 上，同目录建 .env（参考 .env.example），然后
#   docker compose up -d --build
# 访问 http://<NAS_IP>:8000  （公网入口按你自己的方案接在前面即可）

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # 仅作行情缓存与告警去重，数据可丢，不开持久化
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: omninav:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # host.docker.internal → 宿主机（NAS 本机）的 PostgreSQL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 指向 NAS 已有的 PostgreSQL；若是 NAS 上另一个容器且未发布端口，
      # 改为与它加入同一 docker 网络后直接填容器名
      DATABASE_URL: ${DATABASE_URL:?请在同目录 .env 中设置 DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      # 业务时区代码内已固定 Asia/Shanghai，这里只影响日志显示
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # 首次启动迁移 0003 会用它在空库播种管理员，之后可留在 .env 不删
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      # 前置 HTTPS（反向代理/Tunnel）后改为 true，否则登录 Cookie 不会带 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 家宽访问 Yahoo（yfinance）需代理时取消注释；AkShare 会自动绕过代理直连国内源
      # HTTPS_PROXY: ${HTTPS_PROXY:-}
      # 反代之后务必改成 * 或代理的容器 IP，否则登录限速按代理 IP 计数（uvicorn 原生读取此变量）
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
